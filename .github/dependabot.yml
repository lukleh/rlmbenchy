version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Disable routine version-update PRs. Dependabot security updates use a
    # separate limit and remain enabled through the repository settings.
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /rlmbenchy/visualizers/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
