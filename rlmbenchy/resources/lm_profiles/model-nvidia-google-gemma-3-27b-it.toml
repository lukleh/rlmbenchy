# Shared model profile: NVIDIA-hosted Google Gemma 3 27B IT over the NIM API.
#
# Auth comes from `NVIDIA_API_KEY`. If your shell sources `~/.secrets`,
# export it there.

[lm]
api_base = "https://integrate.api.nvidia.com/v1"
model = "google/gemma-3-27b-it"
api_key_env = "NVIDIA_API_KEY"

[lm.request]
temperature = 1.0
top_p = 0.95
top_k = 64
