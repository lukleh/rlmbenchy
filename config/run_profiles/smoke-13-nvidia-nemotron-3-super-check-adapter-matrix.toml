# Smoke run: RLM pipeline on check_adapter_matrix with NVIDIA Nemotron 3 Super.
#
# This is a minimal endpoint smoke: one checked-in deterministic task, no
# sub-model, and local REPL execution to avoid a Docker dependency.

lm_profile = "model-nvidia-nemotron-3-super-120b-a12b"
workload = "check_adapter_matrix"
task_limit = 1
max_iterations = 5
max_llm_calls = 10

[repl]
backend = "local"
